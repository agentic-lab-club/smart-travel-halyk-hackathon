      selected_transport:
        $ref: '#/definitions/trip.TransportOption'
      start_date:
        example: "2026-07-10"
        type: string
      status:
        example: collecting_input
        type: string
      title:
        example: Family trip to Japan in July with budget 900000 from Almaty and Kazakhstan
          passport
        type: string
      todo_sections:
        items:
          $ref: '#/definitions/trip.TodoSection'
        type: array
      transport_options:
        items:
          $ref: '#/definitions/trip.TransportOption'
        type: array
      transport_type:
        example: flight
        type: string
      travelers:
        items:
          $ref: '#/definitions/trip.Traveler'
        type: array
      trip_purpose:
