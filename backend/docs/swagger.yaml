      summary: Get recommendations
      tags:
      - '@recommendations'
  /api/v1/trips:
    post:
      consumes:
      - application/json
      description: Creates a new trip draft and returns planning-state JSON for mobile.
      parameters:
      - description: Trip draft payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/tripplanning.CreateTripDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/tripplanning.PlanningTripResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create trip draft
      tags:
      - '@tripplanning'
  /api/v1/trips/{tripId}:
    get:
      description: Returns the final mobile-ready trip bundle for a generated trip.
      parameters:
      - description: Trip ID
        in: path
        name: tripId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tripdetails.TripDetailsResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get generated trip details
      tags:
      - '@tripdetails'
    patch:
      consumes:
      - application/json
      description: Updates normalized planning fields before final confirmation.
      parameters:
      - description: Trip ID
        in: path
        name: tripId
        required: true
        type: string
      - description: Trip patch payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/tripplanning.PatchTripDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tripplanning.PlanningTripResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Patch planning fields
      tags:
      - '@tripplanning'
  /api/v1/trips/{tripId}/activities:
    post:
