      recommended_lead:
        example: Begin visa preparation 30 days before departure
        type: string
      requirement:
        example: Prototype shows a visa-assistant style checklist
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@yourdomain.com
    name: API Support
    url: http://yourdomain.com/support
  description: 'JWT Token as Bearer: Authorization: Bearer {token}'
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://yourdomain.com/terms/
  title: Smart Travel Halyk Backend API
  version: "1.0"
paths:
  /api/v1/healthcheck:
    get:
      description: Returns the application health status and dependency checks.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/healthcheck.HealthCheckResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/healthcheck.HealthCheckResponse'
      summary: Health check
      tags:
      - '@healthcheck'
  /api/v1/healthcheck/liveness:
    get:
      description: Returns whether the process is alive.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/healthcheck.LivenessResponse'
      summary: Liveness probe
      tags:
      - '@healthcheck'
  /api/v1/healthcheck/readiness:
    get:
      description: Returns whether the service is ready to serve traffic.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/healthcheck.ReadinessResponse'
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Readiness probe
      tags:
      - '@healthcheck'
  /api/v1/trips:
    post:
      consumes:
      - application/json
      description: Creates a new trip draft and initializes chat session state.
      parameters:
      - description: Trip draft payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/trip.CreateTripDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/trip.TripDetailsResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create trip draft
      tags:
      - '@trip'
  /api/v1/trips/{tripId}:
    get:
      description: Returns the aggregate trip response for dashboard rendering.
      parameters:
      - description: Trip ID
        in: path
        name: tripId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/trip.TripDetailsResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get trip details
      tags:
      - '@trip'
    patch:
      consumes:
      - application/json
      description: Updates trip-level fields collected before confirmation and generation.
      parameters:
      - description: Trip ID
        in: path
        name: tripId
        required: true
        type: string
      - description: Trip patch payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/trip.PatchTripDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/trip.TripDetailsResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Update trip draft fields
      tags:
      - '@trip'
  /api/v1/trips/{tripId}/activities:
    post:
      consumes:
      - application/json
      description: Adds a place or event item to the trip and updates dashboard state.
      parameters:
      - description: Trip ID
        in: path
        name: tripId
        required: true
        type: string
      - description: Manual activity payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/trip.ManualActivityDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/trip.TripDetailsResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Add activity manually
      tags:
      - '@trip'
  /api/v1/trips/{tripId}/budget:
    get:
      description: Returns aggregate trip costs, cashback, bonus, and offer fields.
      parameters:
      - description: Trip ID
        in: path
        name: tripId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/trip.BudgetSummary'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get budget summary
      tags:
      - '@trip'
  /api/v1/trips/{tripId}/chat/messages:
    get:
      description: Returns the current chat history attached to a trip planning session.
      parameters:
      - description: Trip ID
        in: path
        name: tripId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/trip.ChatResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get trip chat history
      tags:
      - '@trip'
    post:
      consumes:
      - application/json
      description: Adds a user message to the trip planning session and returns AI
        chat output.
      parameters:
      - description: Trip ID
        in: path
        name: tripId
        required: true
        type: string
      - description: Chat message payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/trip.ChatMessageDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/trip.ChatResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Send planning chat message
      tags:
      - '@trip'
  /api/v1/trips/{tripId}/confirm:
    post:
      description: Confirms collected fields and generates the master-plan dashboard
        response.
      parameters:
      - description: Trip ID
        in: path
        name: tripId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/trip.TripDetailsResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Confirm trip and generate plan
      tags:
      - '@trip'
  /api/v1/trips/{tripId}/options/hotels:
    get:
      description: Returns selected and alternative hotel options for a trip.
      parameters:
      - description: Trip ID
        in: path
        name: tripId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/trip.HotelOption'
            type: array
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get hotel options
      tags:
      - '@trip'
  /api/v1/trips/{tripId}/options/hotels/{optionId}/select:
    post:
      description: Replaces the currently selected hotel option and recalculates budget.
      parameters:
      - description: Trip ID
        in: path
        name: tripId
        required: true
        type: string
      - description: Hotel option ID
        in: path
        name: optionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/trip.TripDetailsResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Select hotel option
      tags:
      - '@trip'
  /api/v1/trips/{tripId}/options/transport:
    get:
      description: Returns selected and alternative transport options for a trip.
      parameters:
      - description: Trip ID
        in: path
        name: tripId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/trip.TransportOption'
            type: array
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get transport options
      tags:
      - '@trip'
  /api/v1/trips/{tripId}/options/transport/{optionId}/select:
    post:
      description: Replaces the currently selected transport option and recalculates
        budget.
      parameters:
