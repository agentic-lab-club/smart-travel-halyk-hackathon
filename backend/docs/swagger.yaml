paths:
  /api/v1/healthcheck:
    get:
      description: Returns the application health status and dependency checks.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/healthcheck.HealthCheckResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/healthcheck.HealthCheckResponse'
      summary: Health check
      tags:
      - '@healthcheck'
  /api/v1/healthcheck/liveness:
    get:
      description: Returns whether the process is alive.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/healthcheck.LivenessResponse'
      summary: Liveness probe
      tags:
      - '@healthcheck'
  /api/v1/healthcheck/readiness:
    get:
      description: Returns whether the service is ready to serve traffic.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/healthcheck.ReadinessResponse'
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Readiness probe
      tags:
      - '@healthcheck'
  /api/v1/hotels/{hotelId}:
    get:
      description: Returns the full hotel details model expected by mobile.
      parameters:
      - description: Hotel ID
        in: path
        name: hotelId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hoteldetails.HotelDetailsFull'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get hotel details
      tags:
      - '@hoteldetails'
  /api/v1/recommendations:
    get:
      description: Returns recommendation cards formatted for the mobile entry flow.
      produces:
